---
# Image update check, snapshot, upgrade, verify, approval gate, rollback or record.
- name: Update NVR images
  hosts: nvr
  gather_facts: true
  force_handlers: true
  vars_files:
    # Local pins once an update was approved, else the tracked defaults (D-29).
    - ["../state/images.yml", "../state/images.yml.example"]
  roles:
    - update
