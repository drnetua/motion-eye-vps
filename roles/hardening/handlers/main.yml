---
- name: Validate sshd configuration
  ansible.builtin.command: sshd -t
  changed_when: false
  listen: Validate and reload sshd

- name: Reload sshd
  ansible.builtin.systemd_service:
    name: ssh
    state: reloaded
  listen: Validate and reload sshd

- name: Restart fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    state: restarted
